# Original trilinear3D weather field. No compute/image/SSBO requirement on macOS.
customTexture.vanillaSun=minecraft:textures/environment/celestial/sun.png
customTexture.vanillaClouds=minecraft:textures/environment/clouds.png
customTexture.weatherNoise=volumes/weather.rgba8 TEXTURE_3D RGBA8 128 128 128 RGBA UNSIGNED_BYTE

# Water refraction restored to v1.3.1; no extra geometry/shadow rendering.
shadow.enabled=false

# Independent atmosphere target: preserve full-resolution water at lower cloud cost.
#if ATMOSPHERE_QUALITY == 2
size.buffer.colortex11=1.0 1.0
#elif ATMOSPHERE_QUALITY == 1
size.buffer.colortex11=0.5 0.5
#else
size.buffer.colortex11=0.25 0.25
#endif

# Water optics scale independently; opaque geometry and underwater receivers stay sharp.
#if WATER_RENDER_QUALITY == 2
size.buffer.colortex12=1.0 1.0
#elif WATER_RENDER_QUALITY == 1
size.buffer.colortex12=0.5 0.5
#else
size.buffer.colortex12=0.35 0.35
#endif

