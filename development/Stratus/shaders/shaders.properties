# Stratus: a standalone implementation of the attached visual specification.
#if CLOUD_STYLE == 1
clouds=fancy
#else
clouds=off
#endif
sky=false
#if SUN_STYLE == 1
sun=true
moon=true
#else
sun=false
moon=false
#endif
stars=false
vignette=false
underwaterOverlay=false
#if REALISTIC_LIGHTING == 0
oldLighting=true
# The vanilla transfer has no bloom contribution: avoid its two unused passes.
program.composite5.enabled=false
program.composite6.enabled=false
#else
oldLighting=false
#endif
# The reflection cache has no readers when scenery reflections are disabled.
#if REFLECTION_MODE == 0
program.composite.enabled=false
#endif
separateAo=false
particles.ordering=after
separateEntityDraws=true

# Two-column effect groups. Every retained option remains reachable.
screen=<profile> <empty> [LIGHTING] [WATER] [ATMOSPHERE] [MATERIALS] [POST] [PERFORMANCE]
